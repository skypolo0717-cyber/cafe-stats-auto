<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>네이버 카페 통계 트래커 (자동)</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="wrap">
  <h1>네이버 카페 통계 트래커</h1>
  <div class="subtitle">매일 새벽 1시(KST) GitHub Actions가 자동으로 조사한 카페 수치입니다.</div>

  <div class="card">
    <div class="row" style="justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <h2 style="margin: 0;">카페 비교</h2>
      <button id="refreshBtn" class="secondary">새로고침</button>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>카페</th>
            <th>총 회원</th>
            <th>가입 증감</th>
            <th>총 방문자</th>
            <th>방문자 증감</th>
            <th id="compareCitationHeader">누적 인용</th>
            <th id="compareCitationDeltaHeader">인용 증감</th>
            <th>기준일</th>
          </tr>
        </thead>
        <tbody id="compareBody"></tbody>
      </table>
    </div>
    <div class="export-row">
      <button id="exportAllBtn" class="secondary">카페 비교 엑셀로 내보내기</button>
    </div>
    <div class="footer-note">
      매일 01:00(KST)에 자동으로 수치를 조사해 기록합니다 (수동 확인 불필요).<br>
      증감값 = 오늘 조사한 값 - 전날 조사한 값입니다.<br>
      ※ 인용수는 "네이버 메이트"로 선정된 카페에만 표시되며, 만(10,000) 단위로 반올림된 값입니다.<br>
      카페를 추가/삭제하려면 저장소의 <code>cafes.json</code> 파일을 수정해주세요.
    </div>
  </div>
</div>
<script src="xlsx.mini.min.js"></script>
<script src="scripts/common.js"></script>
<script src="app.js"></script>
</body>
</html>
